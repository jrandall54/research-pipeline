[project]
name = "research-pipeline"
version = "0.1.0"
description = "Nightly pipeline that collects, ranks and digests research papers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "typer",
    "httpx",
    "feedparser",
    "numpy",
]

[project.optional-dependencies]
embed = ["sentence-transformers"]

[project.scripts]
research-pipeline = "research_pipeline.cli:app"

[dependency-groups]
dev = ["pytest", "respx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
