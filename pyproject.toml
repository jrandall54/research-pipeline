[project]
name = "research-pipeline"
version = "0.1.0"
description = "Nightly pipeline that collects, ranks and digests research papers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "typer",
    "httpx",
    "numpy",
    "ruamel-yaml>=0.19.1",
    "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers"]
serve = ["datasette>=0.65,<1"]
app = ["fastapi>=0.110", "jinja2>=3.1", "uvicorn>=0.29"]

[project.scripts]
rpipe = "research_pipeline.cli:app"
research-pipeline = "research_pipeline.cli:app"

[dependency-groups]
dev = ["pytest", "respx", "ruff", "fastapi", "jinja2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Long lines are kept as written (some are prose strings and tables); ruff format is not used.
ignore = ["E501"]
