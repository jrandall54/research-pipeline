# Pipeline settings. Written once by `rpipe init`; never overwritten.

# Absolute path of this vault folder (set by init).
vault_path: __VAULT_PATH__

# arXiv categories to collect from each night.
# Use ["all"] for every computer-science category (cs.*; far more papers per night;
# physics, maths and stat categories such as stat.ML are not included).
# cs.LG machine learning, cs.CL language, cs.CR security, cs.OS operating systems, cs.SE software engineering.
arxiv_categories: __CATEGORIES__

# Most papers to fetch from arXiv per run. Paging stops earlier once it reaches a page
# containing a paper already stored. The first run (empty database) always fetches up to this
# many and will report "reached max_results"; that is expected.
arxiv_max_results: 1000

# Sentence-embedding model used to measure similarity between papers and your profile.
# Downloaded from Hugging Face the first time triage runs.
embedding_model: BAAI/bge-small-en-v1.5

# Local model server (Ollama) used to write summaries.
# `auto` picks the largest installed model that fits fully in GPU memory, and the largest
# context window it can hold. Pin a model with `rpipe model set NAME`, go back with
# `rpipe model set auto`; re-check the choice with `rpipe model fit`.
llm_model: auto
llm_url: http://localhost:11434
# Context window in tokens: how much text the model can read at once (at least 8192, or auto).
# Pin it with `rpipe model set-context N`; go back with `rpipe model set-context auto`.
llm_num_ctx: auto

# Which backend writes summaries: ollama (a model on this computer, the default) or
# claude-code (your Claude subscription). Choose with `rpipe model setup`.
llm_backend: ollama
# How hard Claude Code thinks per call: low (fast, the default), medium or high (slower, more
# hidden thinking). Only the claude-code backend uses it. Change with `rpipe model set-effort`.
llm_effort: low
# Full path of the subscription CLI (for example claude). Recorded by `rpipe model setup`;
# leave empty for Ollama.
llm_cli_path: null

# Paper sources to collect from, in this order. List what exists with `rpipe sources list`;
# turn one on or off with `rpipe sources enable NAME` / `rpipe sources disable NAME`.
sources: [arxiv, hf_daily]

# Morning deadline (24-hour, local time) by which reruns of cut papers must finish, or off for
# no reruns. Normal papers always run. Change with `rpipe schedule set-deadline`.
night_deadline: "07:00"
