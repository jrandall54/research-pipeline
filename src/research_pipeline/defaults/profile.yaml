# Your research profile. Edit freely; `research-pipeline init` never overwrites this file.

# What you care about, in plain words. Each topic is embedded and papers are
# ranked by how close they are to these phrases. Specific phrases work better than
# single words. (The examples below are generic; replace them.)
topics: __TOPICS__

# arXiv ids of 10-20 papers you really like. New papers are ranked by similarity
# to these. The three below are PLACEHOLDERS: replace them with your own picks.
# Use the bare id IN QUOTES, e.g. "1706.03762" (not the URL). Quotes matter: without them
# YAML reads the id as a number and drops trailing zeros (2301.10000 becomes 2301.1).
seeds:
  - "0000.00001"  # PLACEHOLDER - replace with a paper you like
  - "0000.00002"  # PLACEHOLDER - replace with a paper you like
  - "0000.00003"  # PLACEHOLDER - replace with a paper you like

# Authors whose new papers get a ranking boost (names as arXiv spells them).
# followed_authors:
#   - Jane Example
followed_authors: []

# Words that give a small boost when they appear in a title or abstract.
# keywords:
#   - prompt injection
keywords: []

# How many papers to keep in each night's digest (the rest are marked skipped).
top_n: 15
